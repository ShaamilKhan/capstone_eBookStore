openapi: 3.0.3
info:
  title: E-Bookstore API
  description: Complete REST API for the E-Bookstore capstone application
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
  - name: Categories
  - name: Brands
  - name: Products
  - name: Cart
  - name: Orders
  - name: Addresses
  - name: Reviews
  - name: Recommendations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, example: "Jane Doe" }
        email: { type: string, format: email, example: "jane@example.com" }
        password: { type: string, minLength: 8, example: "password123" }
        phone: { type: string, example: "+1-555-0100" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "jane@example.com" }
        password: { type: string, example: "password123" }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        id: { type: integer, format: int64 }
        fullName: { type: string }
        email: { type: string }
        giftPoints: { type: integer }

    UserProfileResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        giftPoints: { type: integer }
        createdAt: { type: string, format: date-time }

    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }

    CategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }

    BrandResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        logoUrl: { type: string }

    ProductSummaryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        price: { type: number, format: double }
        imageUrl: { type: string }
        rating: { type: number, format: double }
        categoryName: { type: string }
        brandName: { type: string }
        stockQuantity: { type: integer }

    ProductDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ProductSummaryResponse'
        - type: object
          properties:
            description: { type: string }
            isbn: { type: string }
            pages: { type: integer }
            language: { type: string }
            estimatedDeliveryDays: { type: integer }
            reviewCount: { type: integer }
            category:
              type: object
              properties:
                id: { type: integer, format: int64 }
                name: { type: string }
            brand:
              type: object
              properties:
                id: { type: integer, format: int64 }
                name: { type: string }

    ProductPageResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummaryResponse' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        currentPage: { type: integer }
        pageSize: { type: integer }

    AddToCartRequest:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, default: 1 }

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }

    CartItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        product: { $ref: '#/components/schemas/ProductSummaryResponse' }
        quantity: { type: integer }
        itemTotal: { type: number, format: double }

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponse' }
        subtotal: { type: number, format: double }
        shipping: { type: number, format: double }
        total: { type: number, format: double }
        itemCount: { type: integer }

    PlaceOrderRequest:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId: { type: integer, format: int64 }
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, GIFT_POINTS]
        useGiftPoints: { type: boolean, default: false }
        cardNumber: { type: string }
        cardExpiry: { type: string }
        cardCvv: { type: string }

    AddressRequest:
      type: object
      properties:
        label: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
        country: { type: string }
        isDefault: { type: boolean }

    AddressResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
        country: { type: string }
        isDefault: { type: boolean }

    OrderItemResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        product: { $ref: '#/components/schemas/ProductSummaryResponse' }
        quantity: { type: integer }
        unitPrice: { type: number, format: double }
        subtotal: { type: number, format: double }

    OrderSummaryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        totalAmount: { type: number, format: double }
        placedAt: { type: string, format: date-time }
        itemCount: { type: integer }
        paymentMethod: { type: string }
        paymentStatus: { type: string }

    OrderDetailResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        totalAmount: { type: number, format: double }
        placedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        giftPointsUsed: { type: integer }
        giftPointsEarned: { type: integer }
        address: { $ref: '#/components/schemas/AddressResponse' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }

    CreateReviewRequest:
      type: object
      required: [productId, rating]
      properties:
        productId: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    ReviewResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        fullName: { type: string }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user
      description: Creates a new user account and returns a JWT token for immediate login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              fullName: "Jane Doe"
              email: "jane@example.com"
              password: "password123"
              phone: "+1-555-0100"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Validation error or email already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate user
      description: Validates credentials and returns a JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: "jane@example.com"
              password: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getProfile
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      tags: [Authentication]
      operationId: updateProfile
      summary: Update current user profile
      description: Updates full name and/or phone number for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/categories:
    get:
      tags: [Categories]
      operationId: getCategories
      summary: List all categories
      description: Returns all product categories available in the store.
      security: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryResponse' }

  /api/categories/{id}:
    get:
      tags: [Categories]
      operationId: getCategoryById
      summary: Get category by ID
      description: Returns a single category by its ID.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '404':
          description: Category not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/brands:
    get:
      tags: [Brands]
      operationId: getBrands
      summary: List all brands/publishers
      description: Returns all publisher brands available in the store.
      security: []
      responses:
        '200':
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandResponse' }

  /api/brands/{id}:
    get:
      tags: [Brands]
      operationId: getBrandById
      summary: Get brand by ID
      description: Returns a single brand/publisher by its ID.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Brand found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandResponse' }
        '404':
          description: Brand not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/products:
    get:
      tags: [Products]
      operationId: getProducts
      summary: List products with filters
      description: Returns a paginated list of products with optional filters for category, brand, price range, and search query.
      security: []
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: brandId
          in: query
          schema: { type: integer, format: int64 }
        - name: search
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc, rating], default: relevance }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 12 }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPageResponse' }

  /api/products/featured:
    get:
      tags: [Products]
      operationId: getFeaturedProducts
      summary: Get featured products
      description: Returns up to 8 top-rated products for the homepage featured section.
      security: []
      responses:
        '200':
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummaryResponse' }

  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get product by ID
      description: Returns full product details including description, ISBN, pages, language, and review count.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetailResponse' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/products/{id}/related:
    get:
      tags: [Products]
      operationId: getRelatedProducts
      summary: Get related products
      description: Returns up to 4 products in the same category, excluding the current product.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummaryResponse' }

  /api/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get current user's cart
      description: Returns the shopping cart for the authenticated user including subtotal, shipping and total.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Clear the cart
      description: Removes all items from the authenticated user's cart.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Cart cleared
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/cart/items:
    post:
      tags: [Cart]
      operationId: addToCart
      summary: Add item to cart
      description: Adds a product to the cart. If the product already exists, quantity is incremented.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddToCartRequest' }
            example: { productId: 1, quantity: 2 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: Out of stock or invalid quantity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/cart/items/{id}:
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Update cart item quantity
      description: Sets a new quantity for a specific cart item.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: Invalid quantity or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove item from cart
      description: Removes a specific item from the cart.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cart item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/orders:
    get:
      tags: [Orders]
      operationId: getOrders
      summary: Get order history
      description: Returns paginated order history for the authenticated user, sorted by date descending.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummaryResponse' }
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  currentPage: { type: integer }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place a new order
      description: Creates an order from the current cart. Validates stock, applies gift points discount, and clears the cart.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            example:
              addressId: 1
              paymentMethod: "CREDIT_CARD"
              useGiftPoints: false
              cardNumber: "4111111111111111"
              cardExpiry: "12/26"
              cardCvv: "123"
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }
        '400':
          description: Empty cart or insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get order by ID
      description: Returns full order details including items, address, and gift points.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Order does not belong to user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/orders/{id}/cancel:
    put:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Cancels an order if it is in PENDING or CONFIRMED status and was placed within the last 48 hours. Restores stock and refunds gift points used.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }
        '400':
          description: Order outside 48-hour window or wrong status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Order does not belong to user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/addresses:
    get:
      tags: [Addresses]
      operationId: getAddresses
      summary: Get user addresses
      description: Returns all saved delivery addresses for the authenticated user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AddressResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Addresses]
      operationId: addAddress
      summary: Add a new address
      description: Creates a new delivery address for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
            example:
              label: "Home"
              street: "123 Main St"
              city: "New York"
              state: "NY"
              zipCode: "10001"
              country: "USA"
              isDefault: true
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/addresses/{id}:
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: Update an address
      description: Updates an existing delivery address belonging to the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressRequest' }
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Address does not belong to user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Address not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: Delete an address
      description: Deletes a delivery address belonging to the authenticated user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Address deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Address does not belong to user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Address not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/addresses/{id}/default:
    put:
      tags: [Addresses]
      operationId: setDefaultAddress
      summary: Set address as default
      description: Marks the specified address as the default delivery address, clearing the flag on all others.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Default address updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Address does not belong to user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Address not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Create a product review
      description: Submits a rating and comment for a product. Each user can review a product only once. Updates product average rating on creation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
            example: { productId: 1, rating: 5, comment: "Excellent book!" }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResponse' }
        '400':
          description: Already reviewed this product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reviews/product/{productId}:
    get:
      tags: [Reviews]
      operationId: getProductReviews
      summary: Get reviews for a product
      description: Returns all reviews for a product ordered by most recent first.
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewResponse' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/recommendations:
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: Get personalized book recommendations
      description: Returns up to 6 book recommendations based on the user's order history. Falls back to top-rated books if no orders exist.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recommended products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummaryResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
